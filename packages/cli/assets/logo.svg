<svg xmlns="http://www.w3.org/2000/svg" viewBox="14 14 372 372" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#0F172A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>

    <!-- Core Compression Gradients -->
    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="streamGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#A855F7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="coreBeam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <linearGradient id="prismEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="focusGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="1"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Badge Frame -->
  <rect x="16" y="16" width="368" height="368" rx="84" fill="url(#bgGlow)" stroke="#334155" stroke-width="2" stroke-opacity="0.6"/>
  <rect x="24" y="24" width="352" height="352" rx="76" fill="none" stroke="url(#prismEdge)" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Background Technical Matrix Lines -->
  <g opacity="0.15">
    <line x1="80" y1="60" x2="80" y2="340" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="200" y1="60" x2="200" y2="340" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2 6"/>
    <line x1="320" y1="60" x2="320" y2="340" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="60" y1="200" x2="340" y2="200" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2 6"/>
  </g>

  <!-- Incoming Stream Waves (Left: Broad Chaotic Data) -->
  <g stroke-linecap="round">
    <!-- Stream 1: Top Outer -->
    <path d="M 72 100 C 130 100, 160 170, 200 188" fill="none" stroke="url(#streamGrad1)" stroke-width="6" opacity="0.6"/>
    <circle cx="72" cy="100" r="4" fill="#38BDF8" opacity="0.8"/>

    <!-- Stream 2: Top Mid -->
    <path d="M 64 140 C 120 140, 160 180, 200 194" fill="none" stroke="url(#streamGrad1)" stroke-width="7" opacity="0.85"/>
    <circle cx="64" cy="140" r="4.5" fill="#38BDF8"/>

    <!-- Stream 3: Center Input -->
    <path d="M 56 200 L 200 200" fill="none" stroke="url(#coreBeam)" stroke-width="8" opacity="0.9" filter="url(#neonGlow)"/>
    <circle cx="56" cy="200" r="5" fill="#C084FC"/>

    <!-- Stream 4: Bottom Mid -->
    <path d="M 64 260 C 120 260, 160 220, 200 206" fill="none" stroke="url(#streamGrad2)" stroke-width="7" opacity="0.85"/>
    <circle cx="64" cy="260" r="4.5" fill="#EC4899"/>

    <!-- Stream 5: Bottom Outer -->
    <path d="M 72 300 C 130 300, 160 230, 200 212" fill="none" stroke="url(#streamGrad2)" stroke-width="6" opacity="0.6"/>
    <circle cx="72" cy="300" r="4" fill="#EC4899" opacity="0.8"/>
  </g>

  <!-- Compression Funnel Prism (Center Geometric Focus) -->
  <g filter="url(#intenseGlow)">
    <!-- Funnel Facet Left -->
    <polygon points="184,136 216,184 216,216 184,264 168,200" fill="#1E1B4B" fill-opacity="0.7" stroke="url(#prismEdge)" stroke-width="2"/>
    
    <!-- Core Converging Monolith Lens -->
    <polygon points="208,160 252,192 252,208 208,240 220,200" fill="url(#focusGlow)" fill-opacity="0.85"/>
  </g>

  <!-- Distilled Laser Output Stream (Right: Ultra-Condensed Dense Beam) -->
  <g filter="url(#intenseGlow)">
    <!-- Main Laser Core -->
    <line x1="252" y1="200" x2="344" y2="200" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <line x1="252" y1="200" x2="344" y2="200" stroke="url(#focusGlow)" stroke-width="12" stroke-linecap="round" opacity="0.75"/>
    
    <!-- Output Terminal Spark / Target Node -->
    <circle cx="344" cy="200" r="6" fill="#FFFFFF"/>
    <circle cx="344" cy="200" r="10" fill="none" stroke="#F43F5E" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- Precision Corner Nodes & Calibrations -->
  <g fill="#64748B" opacity="0.7">
    <circle cx="56" cy="56" r="3"/>
    <circle cx="344" cy="56" r="3"/>
    <circle cx="56" cy="344" r="3"/>
    <circle cx="344" cy="344" r="3"/>
    
    <path d="M 48 68 L 48 48 L 68 48" fill="none" stroke="#475569" stroke-width="2"/>
    <path d="M 352 68 L 352 48 L 332 48" fill="none" stroke="#475569" stroke-width="2"/>
    <path d="M 48 332 L 48 352 L 68 352" fill="none" stroke="#475569" stroke-width="2"/>
    <path d="M 352 332 L 352 352 L 332 352" fill="none" stroke="#475569" stroke-width="2"/>
  </g>
</svg>

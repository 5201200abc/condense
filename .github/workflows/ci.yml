name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: Build and validate all npm packages without publishing
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - run: bun test

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_dry_run)
    needs: test
    # macOS can ad-hoc sign both Darwin targets after Bun cross-compilation.
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: bun install --frozen-lockfile
      - name: Build all platform binaries
        env:
          CONDENSE_BUILD_ALL: "1"
        run: bun run build
      - run: bun run prepare:publish-platforms
      - run: bun run scripts/release-check.ts --publish
      - name: Validate npm packages without publishing
        if: github.event_name == 'workflow_dispatch'
        run: sh scripts/publish-npm.sh --dry-run
      - name: Publish npm packages
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret is missing. Add it to this repository to publish condense and platform packages."
            exit 1
          fi
          sh scripts/publish-npm.sh
